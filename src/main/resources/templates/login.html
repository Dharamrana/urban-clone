<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — UrbanService</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<header>
    <div class="container">
        <a href="/" class="logo">
            <i class="fas fa-tools"></i>
            <span>UrbanService</span>
        </a>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/services">Services</a></li>
                <li><a href="/request">Book Service</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
        </nav>
        <div class="auth-buttons">
            <a href="/login" class="btn btn-outline">Log in</a>
            <a href="/signup" class="btn btn-primary">Sign up</a>
        </div>
    </div>
</header>

<section class="page-header">
    <div class="container">
        <h1>Welcome back</h1>
        <p>Log in to book, track and rate services</p>
    </div>
</section>

<section class="booking-form-section">
    <div class="container">
        <div class="booking-form-container">
            <form th:action="@{/login}" method="post" class="booking-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div th:if="${param.error}" class="auth-error">
                    Invalid email or password. Please try again.
                </div>
                <div th:if="${param.logout}" class="auth-ok">
                    You have been logged out.
                </div>
                <div class="form-section">
                    <div class="form-group">
                        <label for="username">Email address</label>
                        <input type="email" id="username" name="username" required autocomplete="email" placeholder="you@example.com">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Your password">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Log in</button>
                    <p class="auth-switch">New here? <a href="/signup">Create an account</a></p>
                </div>
            </form>
        </div>
    </div>
</section>

<footer>
    <div class="container">
        <div class="footer-bottom">
            <p>&copy; 2024 UrbanService. All rights reserved.</p>
        </div>
    </div>
</footer>
</body>
</html>
