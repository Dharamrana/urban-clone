<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login — UrbanService</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<header><div class="container"><a href="/" class="logo"><i class="fas fa-tools"></i><span>UrbanService</span></a><nav><ul><li><a href="/">Home</a></li><li><a href="/services">Services</a></li><li><a href="/about">About</a></li></ul></nav><div class="auth-buttons"><a href="/signup" class="btn btn-primary">Sign up</a></div></div></header>
<section class="page-header"><div class="container"><h1>Choose your workspace</h1><p>Use the account type that matches your role.</p></div></section>
<section class="booking-form-section"><div class="container"><div class="booking-form-container">
    <div class="role-picker"><button type="button" class="role-choice active" data-role="USER"><i class="fas fa-user"></i><strong>User</strong><span>Book local services</span></button><button type="button" class="role-choice" data-role="PROVIDER"><i class="fas fa-toolbox"></i><strong>Service provider</strong><span>Manage jobs and revenue</span></button><button type="button" class="role-choice" data-role="ADMIN"><i class="fas fa-shield-halved"></i><strong>Admin / creator</strong><span>Protected platform access</span></button></div>
    <form th:action="@{/login}" method="post" class="booking-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><input type="hidden" id="selectedRole" name="selectedRole" value="USER"/><div th:if="${param.error}" class="auth-error">Invalid email, password, or account role.</div><div class="form-section"><div class="form-group"><label for="username">Email address</label><input type="email" id="username" name="username" required autocomplete="email"></div><div class="form-group"><label for="password">Password</label><input type="password" id="password" name="password" required autocomplete="current-password"></div></div><div class="form-actions"><button type="submit" class="btn btn-primary btn-lg" style="width:100%">Log in</button><p class="auth-switch">New here? <a href="/signup">Create a user account</a></p></div></form>
</div></div></section>
<script>document.querySelectorAll('.role-choice').forEach(function(button){button.addEventListener('click',function(){document.querySelectorAll('.role-choice').forEach(function(b){b.classList.remove('active')});button.classList.add('active');document.getElementById('selectedRole').value=button.dataset.role;});});</script>
</body></html>
