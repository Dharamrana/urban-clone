<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!-- ═══════════ HAMBURGER MENU ═══════════ -->
<th:block th:fragment="hamburgerMenu">
<button class="hamburger-btn" id="hamburgerBtn" onclick="toggleSideMenu()">
    <i class="fas fa-bars"></i>
</button>

<div class="side-menu-overlay" id="sideMenuOverlay" onclick="closeSideMenu()"></div>
<aside class="side-menu" id="sideMenu">
    <div class="side-menu-header">
        <div class="side-menu-user" th:if="${currentUser != null}">
            <i class="fas fa-user-circle"></i>
            <div>
                <div class="side-menu-name" th:text="${currentUser.name}">User</div>
                <div class="side-menu-email" th:text="${currentUser.email}">email</div>
            </div>
        </div>
        <div class="side-menu-user" th:if="${currentUser == null}">
            <i class="fas fa-user-circle"></i>
            <div>
                <div class="side-menu-name">Guest</div>
                <div class="side-menu-email"><a href="/login" style="color:var(--accent);">Log in</a> or <a href="/signup" style="color:var(--accent);">Sign up</a></div>
            </div>
        </div>
        <button class="side-menu-close" onclick="closeSideMenu()"><i class="fas fa-times"></i></button>
    </div>

    <div class="side-menu-body">
        <a href="/" class="side-menu-link"><i class="fas fa-home"></i> Home</a>
        <a href="/services" class="side-menu-link"><i class="fas fa-th-large"></i> Services</a>
        <a href="/request" class="side-menu-link"><i class="fas fa-calendar-plus"></i> Book Service</a>
        <a href="/requests" class="side-menu-link" th:if="${currentUser != null}"><i class="fas fa-list-alt"></i> My Bookings</a>
        <a href="/provider-portal" class="side-menu-link" th:if="${currentUser != null && currentUser.role == 'PROVIDER'}"><i class="fas fa-briefcase"></i> Provider Portal</a>

        <div class="side-menu-divider"></div>
        <div class="side-menu-section-title"><i class="fas fa-map-marker-alt"></i> Saved Addresses</div>
        <div id="addressBookList" class="address-book-list">
            <div class="address-book-empty">No saved addresses yet</div>
        </div>
        <button class="side-menu-link side-menu-add-addr" onclick="showAddAddressForm()">
            <i class="fas fa-plus"></i> Add address
        </button>

        <div class="side-menu-divider"></div>
        <form th:action="@{/logout}" method="post" th:if="${currentUser != null}" style="margin:0;">
            <button type="submit" class="side-menu-link side-menu-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </form>
    </div>
</aside>
</th:block>

<!-- ═══════════ LOCATION BAR ═══════════ -->
<th:block th:fragment="locationBar">
<div class="location-bar" id="locationBar">
    <div class="container">
        <div class="location-bar-inner">
            <div class="location-display" id="locationDisplay" onclick="toggleLocationPanel()">
                <i class="fas fa-map-marker-alt"></i>
                <span id="locationText">Set your location</span>
                <i class="fas fa-chevron-down location-chevron"></i>
            </div>
            <div class="location-panel" id="locationPanel">
                <div class="location-panel-header">
                    <strong>Choose location</strong>
                </div>
                <button class="location-option" onclick="useCurrentLocation()">
                    <i class="fas fa-crosshairs"></i>
                    <div>
                        <div class="location-option-title">Use current location</div>
                        <div class="location-option-sub">Auto-detect via GPS</div>
                    </div>
                </button>
                <div class="location-divider"><span>or enter manually</span></div>
                <div class="location-manual">
                    <input type="text" id="manualLocationInput" placeholder="Type your address or area..." class="location-input">
                    <button class="btn btn-primary btn-sm" onclick="setManualLocation()">Set</button>
                </div>
                <div id="savedLocationsList" class="saved-locations"></div>
            </div>
        </div>
    </div>
</div>
</th:block>

</html>
